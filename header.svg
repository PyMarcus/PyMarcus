<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0000">
        <animate attributeName="stop-color" values="#0A0000;#1A0505;#2B0A0A;#1A0505;#0A0000" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2B0A0A">
        <animate attributeName="stop-color" values="#2B0A0A;#0A0000;#1A0505;#2B0A0A;#2B0A0A" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1F3D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF1F3D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)" />

  <!-- Partículas flutuantes -->
  <circle cx="80" cy="40" r="2.5" fill="#FF1F3D" opacity="0.8">
    <animate attributeName="cy" values="40;180;40" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="220" cy="160" r="1.8" fill="#8B1E3F" opacity="0.7">
    <animate attributeName="cy" values="160;20;160" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="50" r="2.2" fill="#5A5A5A" opacity="0.75">
    <animate attributeName="cy" values="50;190;50" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.75;0.1;0.75" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="150" r="2" fill="#FF1F3D" opacity="0.7">
    <animate attributeName="cy" values="150;30;150" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="25" r="1.6" fill="#2B2F36" opacity="0.6">
    <animate attributeName="cy" values="25;195;25" dur="14s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.05;0.6" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Brilho central pulsante atrás do texto -->
  <circle cx="450" cy="105" r="180" fill="url(#glow)">
    <animate attributeName="r" values="150;200;150" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Título com fade-in -->
  <text x="450" y="105" text-anchor="middle" font-family="Fira Code, monospace" font-size="42" font-weight="700" fill="#FF1F3D" opacity="0">
    Marcus Vinícius
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.2s" fill="freeze" />
  </text>

  <!-- Subtítulo com fade-in atrasado -->
  <text x="450" y="145" text-anchor="middle" font-family="Fira Code, monospace" font-size="18" fill="#B0B0B0" opacity="0">
    Backend Engineer · Graph Algorithms &amp; Reinforcement Learning
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1s" fill="freeze" />
  </text>

  <!-- Linha decorativa que "desenha" -->
  <line x1="350" y1="170" x2="550" y2="170" stroke="#FF1F3D" stroke-width="2" stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" values="200;0" dur="1.5s" begin="1.5s" fill="freeze" />
  </line>
</svg>
