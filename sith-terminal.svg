<svg width="100%" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1F3D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF1F3D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="200" rx="10" fill="#0A0A0A" />
  <rect width="900" height="200" rx="10" fill="none" stroke="#FF1F3D" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- "respiração" pulsante ao fundo, remetendo ao tema sem reproduzir o personagem -->
  <circle cx="450" cy="100" r="90" fill="url(#redGlow)">
    <animate attributeName="r" values="70;110;70" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- barra de título estilo terminal -->
  <circle cx="24" cy="22" r="6" fill="#FF5F56" />
  <circle cx="46" cy="22" r="6" fill="#FFBD2E" />
  <circle cx="68" cy="22" r="6" fill="#27C93F" />
  <text x="450" y="27" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#666">sith-mode.sh</text>
  <line x1="0" y1="40" x2="900" y2="40" stroke="#222" stroke-width="1" />

  <!-- linhas de log digitando em sequência -->
  <text x="30" y="70" font-family="Fira Code, monospace" font-size="15" fill="#FF1F3D" opacity="0">
    $ git checkout -b dark-side
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze" />
  </text>

  <text x="30" y="98" font-family="Fira Code, monospace" font-size="15" fill="#98C379" opacity="0">
    &gt; Compiling the Death Star... 100%
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze" />
  </text>

  <text x="30" y="126" font-family="Fira Code, monospace" font-size="15" fill="#E5C07B" opacity="0">
    &gt; WARNING: exhaust port left unpatched
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.5s" fill="freeze" />
  </text>

  <text x="30" y="154" font-family="Fira Code, monospace" font-size="15" fill="#ABB2BF" opacity="0">
    &gt; "I find your lack of unit tests disturbing." — code review, probably
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.6s" fill="freeze" />
  </text>

  <!-- cursor piscando -->
  <rect x="30" y="164" width="10" height="16" fill="#FF1F3D" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" dur="1s" begin="4.2s" repeatCount="indefinite" />
  </rect>
</svg>
